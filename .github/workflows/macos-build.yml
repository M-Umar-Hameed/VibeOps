name: macOS build

# Manual only. release-build.yml already builds macOS on a v* tag via its matrix,
# and publishes it; this workflow makes an unpublished --debug bundle, so firing
# it on tags duplicated ~6 minutes of work for an artifact nobody ships. Kept for
# checking a macOS build without cutting a release.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies at root
        run: npm ci
      - name: Install dependencies in app
        run: cd app && npm ci
      - name: Build sidecar server
        run: npm run build:sidecar:server
      - name: Copy dist-server
        run: mkdir -p app/src-tauri/resources && cp -R dist-server app/src-tauri/resources/server
      # Without this, resources/node is empty and the bundler fails with
      # "glob pattern resources/node/**/* path not found". release-build.yml has
      # always had this step; the macOS job never did, and had never been run.
      - name: Fetch node sidecar binary
        run: node scripts/fetch-node.mjs --target darwin-arm64 --out app/src-tauri/resources/node
      # TAURI_SIGNING_PRIVATE_KEY signs the UPDATER artifact (minisign) and the
      # repo secrets exist — this env block being commented out was the only
      # reason the build died after producing all three bundles. Same
      # unsigned-fallback shape as release-build.yml so a fork without secrets
      # still builds. APPLE_* (OS code signing / notarization) stays out: that
      # is the genuinely Apple-account-gated half.
      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --debug
          else
            npx tauri build --debug --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibeops-macos
          path: app/src-tauri/target/debug/bundle
