name: Release build
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-target: win-x64
            bundles: nsis
          - os: macos-latest
            node-target: darwin-arm64
            bundles: app,dmg
          # Linux was configured everywhere but never built: deb/appimage are in
          # bundle.targets, fetch-node supports linux-x64, build-server installs
          # the linux transformers binaries into the payload, and lib.rs resolves
          # resources/node/linux-x64 — only the release matrix was missing it, so
          # a tagged release shipped nothing for Linux users.
          - os: ubuntu-22.04
            node-target: linux-x64
            bundles: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      # Tauri's Linux build links against webkit2gtk and friends; the runner does
      # not ship them. Without this the new linux matrix entry fails at cargo build.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies at root
        run: npm ci

      - name: Install dependencies in app
        run: cd app && npm ci

      - name: Build sidecar server
        run: node scripts/build-server.mjs --out app/src-tauri/resources/server

      - name: Fetch node sidecar binary
        run: node scripts/fetch-node.mjs --target ${{ matrix.node-target }} --out app/src-tauri/resources/node

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles ${{ matrix.bundles }}
          else
            npx tauri build --bundles ${{ matrix.bundles }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # AppImage is built separately and is allowed to fail. linuxdeploy is itself
      # an AppImage and needs FUSE2, which the ubuntu-22.04 runner does not provide;
      # APPIMAGE_EXTRACT_AND_RUN makes the AppImage tools self-extract instead of
      # FUSE-mounting. Keeping it out of the main build step means a broken AppImage
      # toolchain can no longer sink the .deb — the first tag lost a perfectly good
      # deb because the two were bundled in one command.
      - name: Bundle AppImage (best effort)
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles appimage
          else
            npx tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi
      # macOS updater downloads the .app.tar.gz, not the .app or .dmg; without it
      # latest.json points at a URL that 404s. deb/AppImage cover the Linux bundles.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibeops-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/**/*.sig

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/**/*.sig

  # tauri.conf.json points the updater at releases/latest/download/latest.json,
  # and until now nothing produced that file — the endpoint 404'd, so no installed
  # client could ever see an update. Runs after the matrix so one manifest covers
  # every platform's signature.
  updater-manifest:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate latest.json
        run: |
          TAG=${GITHUB_REF_NAME}
          node scripts/updater-manifest.mjs \
            --dir dist \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --out latest.json
          cat latest.json

      - name: Publish latest.json to the release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: latest.json
